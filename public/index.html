<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shosso — QR dinámicos y enlaces con analíticas</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">Shosso</div>
    <div id="userbar" class="userbar hidden">
      <span id="user-email"></span>
      <span id="user-plan" class="badge"></span>
      <button id="btn-upgrade" class="btn-pro hidden">Mejorar a Pro</button>
      <button id="btn-logout" class="btn-ghost">Salir</button>
    </div>
  </header>

  <main>
    <!-- Auth -->
    <section id="auth" class="card hidden">
      <h1>Entra en Shosso</h1>
      <p class="muted">Crea códigos QR y enlaces cortos. Gratis para empezar.</p>
      <form id="auth-form">
        <input id="email" type="email" placeholder="tu@email.com" autocomplete="email" required />
        <input id="password" type="password" placeholder="Contraseña (8+ caracteres)" autocomplete="current-password" required />
        <div class="row">
          <button type="submit" data-mode="login">Entrar</button>
          <button type="submit" class="btn-ghost" data-mode="register">Crear cuenta</button>
        </div>
      </form>
      <p id="auth-error" class="error"></p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden">
      <div class="card">
        <h2>Nuevo enlace / QR</h2>
        <form id="link-form" class="row">
          <input id="target-url" type="url" placeholder="https://destino.com" required />
          <input id="link-title" type="text" placeholder="Título (opcional)" />
          <button type="submit">Crear</button>
        </form>
        <p id="link-error" class="error"></p>
      </div>

      <div id="links"></div>
    </section>
  </main>

  <div id="qr-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="qr-close">×</button>
      <h3>Tu código QR</h3>
      <img id="qr-img" alt="QR" />
      <p class="muted" id="qr-url"></p>
      <a id="qr-download" class="btn-ghost" download="qr.png">Descargar PNG</a>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
