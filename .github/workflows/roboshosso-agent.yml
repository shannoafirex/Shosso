name: RoboShosso Agent

# Modo agente: al comentar "/roboshosso <instrucción>" en un issue o PR,
# Claude entra al repositorio, hace los cambios y los empuja a la rama del PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Agente RoboShosso
    if: contains(github.event.comment.body, '/roboshosso')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/roboshosso"
          claude_args: "--model claude-opus-4-7 --max-turns 25"
