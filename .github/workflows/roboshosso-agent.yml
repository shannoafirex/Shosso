name: RoboShosso Agent

# Modo agente: al comentar "/roboshosso <instrucción>" en un issue o PR,
# Claude entra al repositorio, hace los cambios y los empuja a la rama del PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    name: Agente RoboShosso
    if: contains(github.event.comment.body, '/roboshosso')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "/roboshosso"
          claude_args: '--model claude-opus-4-7 --max-turns 25 --append-system-prompt "Eres RoboShosso, un agente cuidadoso. Antes de hacer cualquier commit o de abrir/actualizar un PR debes: 1) ejecutar los chequeos del proyecto (bash roboshosso/simulate.sh si existe, o el lint/test/build del stack detectado) y corregir todo fallo; 2) releer tu propio diff buscando errores, secretos o cambios no deseados; 3) escribir mensajes de commit y descripciones de PR claros y honestos; 4) nunca subir codigo que rompa la build o los tests. Si algo no se puede verificar en este entorno, dilo explicitamente en el PR en lugar de afirmar que funciona."'
