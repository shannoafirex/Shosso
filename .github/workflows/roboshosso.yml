name: RoboShosso

# Se dispara en cada PR y en cada push directo: simula (instala + prueba) y,
# en los PRs, además revisa el código con Claude.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**'] # ramas, no tags

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Evita runs encimados y carreras entre agentes en la misma rama/PR. Se separan
# por evento para no cancelar checks obligatorios del PR con un run de push.
concurrency:
  group: roboshosso-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simular y probar el PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar simulación
        id: sim
        run: bash roboshosso/simulate.sh roboshosso-sim.md
        continue-on-error: true

      - name: Publicar resultado
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- roboshosso-sim -->';
            const body = `${marker}\n${fs.readFileSync('roboshosso-sim.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number }
              );
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else {
              // push directo: comenta sobre el commit.
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha, body });
            }

      - name: Marcar el job como fallido si la simulación falló
        if: steps.sim.outcome == 'failure'
        run: |
          echo "La simulación reportó fallos en al menos un chequeo."
          exit 1

  review:
    name: Revisión de código con Claude
    # Solo en PRs del mismo repo: los forks no exponen el secreto del token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review"
          claude_args: "--model claude-opus-4-7"

  autofix:
    name: Verificar y corregir push directo (Claude)
    # Solo en pushes directos que NO sean ya una corrección automática.
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Si la rama ya tiene un PR abierto, lo revisa el job `iterate`: evitamos
      # que dos agentes empujen a la misma rama a la vez.
      - name: ¿La rama tiene un PR abierto?
        id: pr
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${branch}`,
            });
            return data.length > 0 ? 'yes' : 'no';

      - if: steps.pr.outputs.result == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Se hizo un push DIRECTO a este repositorio (sin pasar por un PR), así que
            nadie lo revisó. Verifica y corrige lo necesario:
            1. Mira qué cambió en el último commit: `git show --stat HEAD` y el diff.
            2. Ejecuta los chequeos del proyecto: `bash roboshosso/simulate.sh roboshosso-sim.md`
               (si no hay stack reconocido, corre el lint/test/build que aplique).
            3. Si hay fallos, errores o bugs introducidos por ese commit, corrígelos
               en el código. No hagas refactors ni cambios fuera del alcance del problema.
            4. Si hiciste cambios, súbelos a esta misma rama con:
               `git add -A && git commit -m "fix(roboshosso): corrección automática [skip ci]" && git push origin HEAD`
               El `[skip ci]` es OBLIGATORIO para no entrar en bucle.
            5. Si todo estaba bien, NO hagas ningún commit; solo deja una nota breve.
          claude_args: "--model claude-opus-4-7 --max-turns 20 --allowedTools Bash,Edit,Read,Write,Grep,Glob"

  iterate:
    name: RoboShosso · revisar y corregir hasta dejarlo limpio
    # Solo PRs del mismo repo: no podemos empujar correcciones a un fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tope de seguridad: cuenta las rondas de autocorrección SOLO en este PR
      # (commits entre base y head), para no iterar infinitamente si no converge.
      - name: Contar rondas previas
        id: cap
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE" --quiet || true
          ROUNDS=$(git log --format=%s "origin/$BASE..HEAD" 2>/dev/null | grep -c '\[roboshosso-loop\]' || true)
          echo "rounds=${ROUNDS:-0}" >> "$GITHUB_OUTPUT"
          echo "Rondas de autocorrección en este PR: ${ROUNDS:-0}"

      - name: Revisar y corregir (Claude)
        if: fromJSON(steps.cap.outputs.rounds) < 10
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres RoboShosso revisando este repositorio con motivo de un PR. NO te
            limites al diff: audita TODO el código del repositorio en busca de
            bugs, errores lógicos, casos borde mal manejados, problemas de
            seguridad y fallos reales (no de estilo). Pon atención extra a lo que
            cambió en este PR.
            1. Explora el repo con Glob/Grep/Read para entender su estructura y
               revisar los archivos relevantes (no solo los modificados).
            2. Ejecuta los chequeos: `bash roboshosso/simulate.sh roboshosso-sim.md`
               (o el lint/test/build del stack si no aplica).
            3. Corrige los bugs que pertenezcan al área de este PR. Para bugs en
               OTRAS partes del repo, NO los mezcles aquí: enuméralos en un comentario.
            4. Si corregiste algo, súbelo a la rama del PR con:
               `git add -A && git commit -m "fix(roboshosso): corrección automática [roboshosso-loop]" && git push origin HEAD`
               (ese push hará que RoboShosso vuelva a revisar y simular: así iteran
               hasta quedar limpio.)
            5. Deja un comentario resumiendo qué revisaste (todo el repo), qué
               encontraste y qué corregiste. Si no quedan bugs y los chequeos
               pasan, dilo explícitamente.
            6. Si detectas un problema que NO puedes corregir con seguridad, deja
               un comentario explicándolo y pidiendo revisión humana.
          claude_args: "--model claude-opus-4-7 --max-turns 40 --allowedTools Bash,Edit,Read,Write,Grep,Glob"

      - name: Pedir revisión humana si se agotaron las rondas
        if: fromJSON(steps.cap.outputs.rounds) >= 10
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '🤖 RoboShosso llegó al tope de 10 rondas de autocorrección sin dejar el código limpio. Requiere **revisión humana**: probablemente hay algo que no se puede resolver automáticamente o que oscila entre cambios.'
            });
