name: RoboShosso

# Se dispara en cada PR y en cada push directo: simula (instala + prueba) y,
# en los PRs, además revisa el código con Claude.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  simulate:
    name: Simular y probar el PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar simulación
        id: sim
        run: bash roboshosso/simulate.sh roboshosso-sim.md
        continue-on-error: true

      - name: Publicar resultado
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- roboshosso-sim -->';
            const body = `${marker}\n${fs.readFileSync('roboshosso-sim.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number }
              );
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else {
              // push directo: comenta sobre el commit.
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha, body });
            }

      - name: Marcar el job como fallido si la simulación falló
        if: steps.sim.outcome == 'failure'
        run: |
          echo "La simulación reportó fallos en al menos un chequeo."
          exit 1

  review:
    name: Revisión de código con Claude
    # La revisión con comentarios línea a línea necesita un PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review"
          claude_args: "--model claude-opus-4-7"

  autofix:
    name: Verificar y corregir push directo (Claude)
    # Solo en pushes directos que NO sean ya una corrección automática.
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Se hizo un push DIRECTO a este repositorio (sin pasar por un PR), así que
            nadie lo revisó. Verifica y corrige lo necesario:
            1. Mira qué cambió en el último commit: `git show --stat HEAD` y el diff.
            2. Ejecuta los chequeos del proyecto: `bash roboshosso/simulate.sh roboshosso-sim.md`
               (si no hay stack reconocido, corre el lint/test/build que aplique).
            3. Si hay fallos, errores o bugs introducidos por ese commit, corrígelos
               en el código. No hagas refactors ni cambios fuera del alcance del problema.
            4. Si hiciste cambios, súbelos a esta misma rama con:
               `git add -A && git commit -m "fix(roboshosso): corrección automática [skip ci]" && git push origin HEAD`
               El `[skip ci]` es OBLIGATORIO para no entrar en bucle.
            5. Si todo estaba bien, NO hagas ningún commit; solo deja una nota breve.
          claude_args: "--model claude-opus-4-7 --max-turns 20 --allowedTools Bash,Edit,Read,Write,Grep,Glob"
